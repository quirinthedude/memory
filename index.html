<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
  </head>
  <body>
    <main class="home">
      <img
        class="home__decoration"
        src="/src/assets/icons/stadia_controller.svg"
        alt=""
      />
      <section class="home__content" aria-labelledby="home-title">
        <p class="home__subtitle">It's play time.</p>
        <h1 id="home-title">Ready to play?</h1>

        <button class="home__play" id="start-game" type="button">
          <img
            class="home__play-icon"
            src="/src/assets/icons/stadia_controller_sm.svg"
            alt=""
          />
          <span>Play</span>
          <img
            class="home__play-arrow"
            src="/src/assets/icons/Arrow 1.svg"
            alt=""
          />
        </button>
      </section>
    </main>
    <h1 id="headline">Memory</h1>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

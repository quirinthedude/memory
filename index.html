<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
  </head>
  <body>
    <main id="app">
      <section id="home" class="home">
        <img
          class="home__decoration"
          src="/src/assets/icons/stadia_controller.svg"
          alt=""
        />
        <div class="home__content" aria-labelledby="home-title">
          <p class="home__subtitle">It's play time.</p>
          <h1 id="home-title">Ready to play?</h1>

          <button class="home__play" id="start-game" type="button">
            <img
              class="home__play-icon"
              src="/src/assets/icons/stadia_controller_sm.svg"
              alt=""
            />
            <span>Play</span>
            <img
              class="home__play-arrow"
              src="/src/assets/icons/Arrow 1.svg"
              alt=""
            />
          </button>
        </div>
      </section>

      <section
        id="settings"
        class="settings"
        aria-labelledby="settings-title"
        hidden
      >
        <div class="settings__container">
          <header class="settings__header">
            <h1 id="settings-title">Settings</h1>
            <img src="./src/assets/icons/line1.svg" alt="" />
          </header>

          <div class="settings__grid">
            <!-- left side settings -->
            <form id="game-settings" class="settings__form">
              <!-- Game Themes -->
              <fieldset class="settings__group">
                <legend>
                  <img src="./src/assets/icons/palette.svg" alt="" /> Game
                  themes
                </legend>

                <label>
                  <input type="radio" name="theme" value="code-vibes" />
                  Code Vibes
                </label>

                <label>
                  <input type="radio" name="theme" value="gaming" />
                  Gaming
                </label>

                <label>
                  <input type="radio" name="theme" value="da-projects" />
                  DA Projects
                </label>

                <label>
                  <input type="radio" name="theme" value="foods" />
                  Foods
                </label>
              </fieldset>

              <!-- Choose Player -->
              <fieldset class="settings__group">
                <legend>
                  <img src="./src/assets/icons/chess_pawn.svg" alt="" /> Choose
                  player
                </legend>

                <label>
                  <input type="radio" name="players" value="1" />
                  One
                </label>

                <label>
                  <input type="radio" name="players" value="2" />
                  Two
                </label>
              </fieldset>

              <!-- Board Size -->
              <fieldset class="settings__group">
                <legend>
                  <img src="./src/assets/icons/style.svg" alt="" /> Board size
                </legend>

                <label>
                  <input type="radio" name="board-size" value="small" />
                  Small
                </label>

                <label>
                  <input type="radio" name="board-size" value="medium" />
                  Medium
                </label>

                <label>
                  <input type="radio" name="board-size" value="large" />
                  Large
                </label>
              </fieldset>
            </form>

            <!-- right side -->
            <div class="settings__right">
              <div
                id="theme-preview"
                class="settings__preview"
                data-theme="code-vibes"
                aria-label="Theme preview"
              >
                <img src="./src/assets/images/previews/code_vibes.svg" alt="" />
              </div>

              <div class="settings__actions">
                <span id="theme-summary">Game theme</span>
                <img id="theme" src="./src/assets/icons/line2.svg" alt="" />
                <span id="player-summary">Player</span>
                <img id="player" src="./src/assets/icons/line2.svg" alt="" />
                <span id="board-summary">Board size</span>

                <button
                  id="start-memory-game"
                  type="submit"
                  form="game-settings"
                  class="settings__start"
                  disabled
                >
                  <img src="./src/assets/icons/start.svg" alt="" />
                  Start
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="game" class="game" hidden>
        <div id="game-header"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
